name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs derives the version from git history and tags.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: ruff check
        run: uv run --group dev ruff check --output-format=github .
      - name: ruff format
        run: uv run --group dev ruff format --check --diff .
      - name: flake8 (hacking)
        run: uv run --group dev flake8 taskflow_meter tests tools examples
      - name: mypy
        run: uv run --group dev mypy
      - name: Test tree mirrors the package
        run: uv run --group dev python tools/check_test_layout.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: pytest
        run: >
          uv run --group dev
          pytest --cov --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Build sdist and wheel
        run: uv build
      - name: Check metadata
        run: uvx twine check dist/*
      - name: Verify the wheel imports and reports a version
        run: |
          uv run --isolated --no-project --with dist/*.whl \
            python -c "import taskflow_meter; print(taskflow_meter.__version__)"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
