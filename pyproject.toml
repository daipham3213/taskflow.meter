[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "taskflow-meter"
dynamic = ["version"]
description = "Monitoring interfaces (ASGI, WSGI, datasource) for OpenStack TaskFlow flow execution progress"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Pham Le Gia Dai", email = "daipham.3213@gmail.com" },
]
keywords = ["taskflow", "openstack", "workflow", "monitoring", "asgi", "wsgi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
# Floors are the oldest release each library is actually tested against,
# not the newest one that happens to be installed here: this package is
# meant to be co-installed into a service whose own constraints it does
# not get to choose.  A `lowest-direct` job in CI installs exactly these.
#
# Only what is imported is declared.  oslo.utils, oslo.serialization and
# stevedore arrive with taskflow, and nothing here imports them.
dependencies = [
    "taskflow>=4.2.0",
    "oslo.config>=6.9.0",
]

[project.optional-dependencies]
sqlalchemy = ["SQLAlchemy>=1.4.0", "alembic>=1.2.0"]
amqp = ["kombu>=5.1.0"]
oslo-messaging = ["oslo.messaging>=6.0.0"]
all = [
    "taskflow-meter[sqlalchemy,amqp,oslo-messaging]",
]

[project.scripts]
taskflow-meter = "taskflow_meter.cli:main"

[project.urls]
Homepage = "https://github.com/daipham3213/taskflow-meter"
Source = "https://github.com/daipham3213/taskflow-meter"
Issues = "https://github.com/daipham3213/taskflow-meter/issues"
Changelog = "https://github.com/daipham3213/taskflow-meter/releases"

# Plugin entry points are declared as their modules land -- one pointing at a
# module that does not exist yet breaks discovery for the whole group.
[project.entry-points."taskflow_meter.datasource"]
memory = "taskflow_meter.datasource.memory:MemoryDataSource"
persistence = "taskflow_meter.datasource.persistence:PersistenceDataSource"
sqlalchemy = "taskflow_meter.datasource.sqlalchemy.source:SQLADataSource"

[project.entry-points."taskflow_meter.transport"]
memory = "taskflow_meter.transports.memory:MemoryTransport"
datasource = "taskflow_meter.transports.memory:DataSourcePublisher"
http = "taskflow_meter.transports.http:HTTPTransport"
amqp = "taskflow_meter.transports.amqp:AMQPTransport"
oslo_messaging = "taskflow_meter.transports.oslo_messaging:OsloMessagingTransport"

# Lets a paste pipeline use `use = egg:taskflow-meter#meter`.
[project.entry-points."paste.app_factory"]
meter = "taskflow_meter.contrib.paste:app_factory"

# Lets oslo-config-generator emit a sample [taskflow_meter] section into
# the host service's config, which is where operators expect to find it.
[project.entry-points."oslo.config.opts"]
taskflow_meter = "taskflow_meter.conf:list_opts"

[dependency-groups]
dev = [
    "hacking>=8.1",
    "mypy>=1.11",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.6",
    # taskflow's sqlite persistence backend, which the persistence
    # datasource is tested against.  SQLAlchemy-Utils is its requirement,
    # not ours.
    "SQLAlchemy>=1.4.0",
    "SQLAlchemy-Utils>=0.41",
    "alembic>=1.2.0",
    # uuidutils, used by the fixtures and the examples.  It arrives with
    # taskflow anyway; naming it here keeps the tests honest about it.
    "oslo.utils>=3.33.0",
    # The broker the AMQP transport speaks; kombu ships an in-process
    # transport, so the collector path is testable without RabbitMQ.
    "kombu>=5.1.0",
    # Likewise: oslo.messaging ships a fake:// driver, so the
    # notification path is testable without a bus.
    "oslo.messaging>=6.0.0",
    # The hosts the contrib adapters are tested inside, at the oldest
    # version each is tested at.  Test-only: a deployment hosting the
    # meter in Django already has Django, so the adapters declare no
    # runtime dependency of their own.
    #
    # Flask 2.3.0 works, but its *test client* reads werkzeug.__version__
    # until 2.3.3 and werkzeug 3.1 removed it, so 2.3.3 is as low as this
    # can be exercised rather than as low as the adapter goes.
    "Django>=3.2",
    "Flask>=2.3.3",
    "PasteDeploy>=2.0",
    "WebOb>=1.8.5",
    "WebTest>=2.0.35",
    "fastapi>=0.100",
    "pecan>=1.4",
]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "taskflow_meter/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["taskflow_meter"]

[tool.hatch.build.targets.sdist]
include = [
    "/taskflow_meter",
    "/tests",
    "/docs",
    "/README.md",
    "/LICENSE",
]

[tool.ruff]
line-length = 79
target-version = "py310"
src = ["."]

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins
    "ARG",  # unused arguments
    "B",    # flake8-bugbear
    "C4",   # comprehensions
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "PT",   # pytest style
    "RET",  # return conventions
    "RUF",  # ruff-specific
    "SIM",  # simplify
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]

[tool.ruff.lint.isort]
known-first-party = ["taskflow_meter", "tests"]
# hacking enforces H301 (one import per line) and it is not in the ignore
# list in tox.ini, so ruff has to sort imports the same way rather than
# combining them.
force-single-line = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["taskflow_meter", "tests", "tools", "examples"]
# taskflow ships no type information, and this package exists to extend
# its classes -- listeners, tasks in the test suite.  Refusing to subclass
# Any would mean giving up on typing the modules that do it.
disallow_subclassing_any = false

[[tool.mypy.overrides]]
# None of these ship type information.
module = ["taskflow.*", "oslo_config.*", "oslo_messaging.*", "oslo_utils.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["taskflow_meter._version"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The frameworks the contrib adapters plug into, none of which ship types.
module = [
    "django.*",
    "flask.*",
    "kombu.*",
    "paste.*",
    "pecan.*",
    "webob.*",
    "webtest.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pecan.expose() is untyped, and decorating with it is the only way to
# register a controller method -- so the alternative to this is not
# typing the adapter at all.
module = ["taskflow_meter.contrib.pecan", "tests.unit.contrib.test_pecan"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# mypy narrows a property like `meter.running` at the first assert and
# does not widen it again after the call that changes it, so a test that
# asserts a lifecycle both ways reads as unreachable.  The production
# code keeps the check.
module = ["tests.*"]
warn_unreachable = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: exercises a real taskflow engine",
]

[tool.coverage.run]
source = ["taskflow_meter"]
branch = true
omit = ["taskflow_meter/_version.py"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
