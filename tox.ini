# Envs mirror the OpenStack convention: `pep8` is the lint gate, the
# pyXY envs run the tests.  Day to day `uv run --group dev ...` is faster;
# tox is what CI and `uvx tox` reproduce.

[tox]
env_list = pep8, py311, py312, py313, py314
skip_missing_interpreters = true

[testenv]
description = Run the test suite under {base_python}
package = wheel
wheel_build_env = .pkg
deps =
    pytest>=8.0
    pytest-cov>=5.0
commands =
    pytest {posargs}

[testenv:cover]
description = Run the test suite with a coverage report
deps = {[testenv]deps}
commands =
    pytest --cov --cov-report=term-missing --cov-report=xml {posargs}

[testenv:pep8]
description = Lint, type check, and check the test tree mirrors the package
deps =
    mypy>=1.11
    pytest>=8.0
    ruff>=0.6
commands =
    ruff check {posargs:.}
    ruff format --check --diff {posargs:.}
    mypy
    python {tox_root}/tools/check_test_layout.py
