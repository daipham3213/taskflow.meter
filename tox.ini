# Envs mirror the OpenStack convention: `pep8` is the lint gate, the
# pyXY envs run the tests.  Day to day `uv run --group dev ...` is faster;
# tox is what CI and `uvx tox` reproduce.

[tox]
env_list = pep8, py311, py312, py313, py314
skip_missing_interpreters = true

[testenv]
description = Run the test suite under {base_python}
package = wheel
wheel_build_env = .pkg
deps =
    pytest>=8.0
    pytest-cov>=5.0
commands =
    pytest {posargs}

[testenv:cover]
description = Run the test suite with a coverage report
deps = {[testenv]deps}
commands =
    pytest --cov --cov-report=term-missing --cov-report=xml {posargs}

[testenv:pep8]
description = Lint, type check, and check the test tree mirrors the package
deps =
    hacking>=8.1
    mypy>=1.11
    pytest>=8.0
    ruff>=0.6
commands =
    ruff check {posargs:.}
    ruff format --check --diff {posargs:.}
    flake8 taskflow_meter tests tools
    mypy
    python {tox_root}/tools/check_test_layout.py

[flake8]
# Ignored hackings:
# H202 assertRaises Exception too broad
# H401 docstrings should not start with a space
# H403 multi line docstrings should end on a new line.
# H404 multi line docstrings should start without a leading new line.
# H405 multi line docstrings should start with a one line summary followed by an empty line.
# W503 line break before binary operator
# W605 invalid escape sequence
# E203 whitespace before ':' -- ruff format writes slices as
#      `items[start : start + n]`, which pycodestyle dislikes
ignore = H104,H202,H306,H401,H403,H404,H405,E203,W503,W605
show-source = true
# _version.py is written by hatch-vcs at build time, so it can carry
# neither a license header nor our formatting.
exclude = .venv,.tox,dist,doc,*egg,specs,build,*/source/conf.py,taskflow_meter/_version.py